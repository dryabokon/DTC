<!DOCTYPE html>
<html lang="en" data-theme="dark">
<script>try { const t = localStorage.getItem("dtc-ui-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTC</title>
<style>
  /* monochrome palette (same as fly2 stand pages); colour only for status. Dark by default, the ◐ button switches (remembered in this browser) */
  :root { --bg: #0e0e0e; --surface: #161616; --field: #1f1f1f; --line: #2a2a2a; --text: #ececec; --muted: #9b9b9b;
          --faint: #666; --accent: #5c5c5c; --accent-text: #fff; --good: #30d158; --bad: #ff453a; --warn: #ff9f0a;
          --good-soft: rgba(48,209,88,.13); --bad-soft: rgba(255,69,58,.13); --video-bg: #050505; --sot: #00e5ff; color-scheme: dark; }
  :root[data-theme=light] { --bg: #f6f6f5; --surface: #fff; --field: #fff; --line: #e2e2df; --text: #141414; --muted: #6b6b6b;
          --faint: #a1a1a1; --accent: #dcdcda; --accent-text: #141414; --good: #0c9b47; --bad: #e0281f; --warn: #b86200;
          --good-soft: rgba(48,209,88,.22); --bad-soft: rgba(255,69,58,.18); --video-bg: #e9e9e7; --sot: #0090c8; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  button, input, select { font: inherit; color: inherit; }

  .topbar { border-bottom: 1px solid var(--line); padding: 0 16px; height: 44px; display: flex; align-items: center; gap: 14px; white-space: nowrap; background: var(--surface); }
  .topbar .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 8px; cursor: pointer; flex: none; }
  .icon-btn:hover { border-color: var(--faint); }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .pill.good { border-color: var(--good); color: var(--good); background: var(--good-soft); cursor: pointer; }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .pill.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .btn.stop { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); margin-top: 8px; }

  main { min-height: 0; display: flex; }
  #sidebar { width: 280px; flex: none; overflow-y: auto; padding: 12px 14px; background: var(--surface); border-right: 1px solid var(--line); }
  #sidebar.collapsed { display: none; }
  .group { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 16px 0 6px; }
  .group:first-child { margin-top: 0; }
  .check { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .check input { accent-color: var(--muted); width: 15px; height: 15px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .row label { color: var(--muted); }
  .val { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--muted); margin: 2px 0 6px; }
  select, input[type=text] { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--text); margin-bottom: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  .seg button { flex: 1; padding: 5px 4px; border: 0; background: var(--field); cursor: pointer; color: var(--muted); font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .btn { width: 100%; padding: 7px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .hint { color: var(--muted); font-size: 12px; }
  .hint b { color: var(--text); font-weight: 600; }
  #source_status { margin-top: 6px; word-break: break-all; }

  #videoContainer { flex: 1; min-width: 0; overflow: auto; background: var(--video-bg); display: flex; align-items: flex-start; justify-content: center; padding: 12px; }
  #videoWrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
  #cameraFeed { max-width: 100%; height: auto; display: block; cursor: crosshair; border-radius: 4px; user-select: none; -webkit-user-drag: none; }
  #freeze { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; border-radius: 4px; }
  #sotPreview { position: absolute; border: 2px dashed var(--sot); pointer-events: none; display: none; border-radius: 2px; }
  #sotPreview.drag { border-style: solid; }
</style>
</head>
<body>

<header class="topbar">
  <h1>DTC</h1>
  <span class="meta" id="topMeta">detection · tracking · classification</span>
  <span class="spacer"></span>
  <span class="pill warn" id="pausePill" hidden title="Space: resume, → : next frame">⏸ paused</span>
  <span class="pill" id="modePill">idle</span>
  <button class="icon-btn" id="restartBtn" type="button" hidden title="Video from the start (R / Home)" aria-label="Video from the start">⏮</button>
  <button class="icon-btn" id="themeBtn" type="button" title="Light / dark theme" aria-label="Light / dark theme">◐</button>
</header>

<main>
  <aside id="sidebar">
    <div class="group">Pipeline</div>
    <label class="check"><input type="checkbox" id="do_detection"> Detection</label>
    <label class="check"><input type="checkbox" id="do_classification"> Classification</label>
    <label class="check"><input type="checkbox" id="do_tracking"> Tracking</label>

    <div class="group">Click-to-track</div>
    <select id="sot_model" title="Single-object tracker used on the next click (a running track stops when changed)"></select>
    <div id="sot_model_status" class="hint"></div>
    <div class="row"><label for="sot_size">Size</label><span class="val" id="sot_size_val">10%</span></div>
    <input type="range" id="sot_size" min="2" max="50" step="1" value="10">
    <div class="seg" id="sot_shape">
      <button data-v="frame" class="on" title="Frame aspect ratio">Frame</button>
      <button data-v="tall" title="Tall box, 1 : 2.5 (a person)">Person</button>
      <button data-v="square" title="Square">Square</button>
      <button data-v="wide" title="Wide box, 2 : 1 (car, boat)">Wide</button>
    </div>
    <button id="sot_stop" class="btn stop" type="button" hidden>■ Stop tracking</button>

    <div class="group">Video source</div>
    <select id="source_select"></select>
    <input id="source_custom" type="text" placeholder="or rtsp://... / path to video, Enter" title="Type a URL or a file path and press Enter">
    <div id="source_status" class="hint"></div>
  </aside>

  <div id="videoContainer">
    <div id="videoWrap">
      <img src="{{ url_for('video_feed') }}" id="cameraFeed" draggable="false" alt="video">
      <canvas id="freeze" hidden></canvas>
      <div id="sotPreview"></div>
    </div>
  </div>
</main>

<script>
    const $ = id => document.getElementById(id);
    const post = (url, body) => fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

    //------------------------------------------------------------------------------------------------------------------
    // Space reaches the Pi ~3 frames after the frame was shown; the Pi then goes back to that frame. Without this the video
    // visibly ran on and jumped back. The frame on screen is frozen here at once and released when the Pi shows the same frame.
    let freezeTimer = null;
    function freezeScreen() {
        const img = $('cameraFeed'), c = $('freeze');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.hidden = false;
        clearTimeout(freezeTimer);
        freezeTimer = setTimeout(unfreeze, 1500);               // the Pi has re-sent the matching paused frame by then
    }
    function unfreeze() { clearTimeout(freezeTimer); $('freeze').hidden = true; }

    function seenThumb() {      // 64x36 grey thumbnail of the frame on screen: block means, like cv2.INTER_AREA on the Pi
        try {
            const img = $('cameraFeed'), W = img.naturalWidth, H = img.naturalHeight, TW = 64, TH = 36;
            const c = document.createElement('canvas'); c.width = W; c.height = H;
            const x = c.getContext('2d'); x.drawImage(img, 0, 0);
            const d = x.getImageData(0, 0, W, H).data, sum = new Float64Array(TW * TH), cnt = new Float64Array(TW * TH);
            for (let y = 0; y < H; y++) {
                const ty = Math.min(TH - 1, Math.floor(y * TH / H));
                for (let xx = 0, i = y * W * 4; xx < W; xx++, i += 4) {
                    const k = ty * TW + Math.min(TW - 1, Math.floor(xx * TW / W));
                    sum[k] += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; cnt[k]++;
                }
            }
            return Array.from(sum, (v, k) => (v / cnt[k]).toFixed(1)).join(',');
        } catch (e) { return ''; }
    }
    $('restartBtn').onclick = () => { fetch('/key_press', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'key=Home'}); $('restartBtn').blur(); };
    $('themeBtn').onclick = () => {
        const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem('dtc-ui-theme', t); } catch (e) {}
    };

    //------------------------------------------------------------------------------------------------------------------
    function updateFromFlask() {
        fetch('/get_config').then(r => r.json()).then(data => {
            $('pausePill').hidden = !data.paused;
            $('restartBtn').hidden = !data.can_pause;          // video files only
            $('do_detection').checked = Boolean(data.do_detection);
            $('do_classification').checked = Boolean(data.do_classification);
            $('do_tracking').checked = Boolean(data.do_tracking);
            const pill = $('modePill');
            $('sot_stop').hidden = !data.sot_active;
            if (data.sot_model && $('sot_model').value !== data.sot_model && document.activeElement !== $('sot_model')) loadSotModels();
            $('sot_model_status').textContent = data.sot_active && data.sot_ms !== null ? `tracking: ${data.sot_ms} ms / frame` : '';
            if (data.sot_active) { pill.textContent = `SOT ${data.sot_model || ''} tracking  ✕`; pill.className = 'pill good'; pill.title = 'Click to stop tracking'; }
            else if (data.sot_stop_reason && data.sot_stop_age !== null && data.sot_stop_age < 8) {
                pill.textContent = data.sot_stop_reason === 'stopped by user' ? 'tracking stopped' : 'SOT: ' + data.sot_stop_reason;
                pill.className = data.sot_stop_reason === 'stopped by user' ? 'pill' : 'pill bad'; pill.title = '';
            }
            else {
                pill.title = '';
                const on = ['do_detection', 'do_tracking', 'do_classification'].filter(k => data[k]).map(k => k.slice(3));
                pill.textContent = on.length ? on.join(' + ') : 'video only'; pill.className = 'pill';
            }
            if (sotSize === null && data.sot_box_ratio) setSize(Math.round(data.sot_box_ratio * 100), false);
        });
    }
    ['do_detection', 'do_classification', 'do_tracking'].forEach(k =>
        $(k).addEventListener('change', function () { post('/update_' + k, {enabled: this.checked}).then(updateFromFlask); }));

    //------------------------------------------------------------------------------------------------------------------
    // click-to-track box: size (% of frame) + shape, remembered in this browser; preview follows the cursor
    const ASPECT = {tall: 0.4, square: 1.0, wide: 2.0};      // width / height; 'frame' = frame aspect
    let sotSize = null, sotShape = 'frame';
    try {
        const s = parseInt(localStorage.getItem('dtc-sot-size')); if (s >= 2 && s <= 50) sotSize = s;
        const sh = localStorage.getItem('dtc-sot-shape'); if (sh && (sh === 'frame' || sh in ASPECT)) sotShape = sh;
    } catch (e) {}

    function setSize(v, remember = true) {
        sotSize = Math.max(2, Math.min(50, v));
        $('sot_size').value = sotSize; $('sot_size_val').textContent = sotSize + '%';
        if (remember) try { localStorage.setItem('dtc-sot-size', sotSize); } catch (e) {}
        redrawPreview();
    }
    function setShape(v) {
        sotShape = v;
        document.querySelectorAll('#sot_shape button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
        try { localStorage.setItem('dtc-sot-shape', v); } catch (e) {}
        redrawPreview();
    }
    $('sot_size').addEventListener('input', function () { setSize(parseInt(this.value)); });
    document.querySelectorAll('#sot_shape button').forEach(b => b.onclick = () => setShape(b.dataset.v));
    const img = $('cameraFeed'), preview = $('sotPreview');
    let hover = null, dragStart = null, dragging = false;
    if (sotSize !== null) setSize(sotSize, false);
    setShape(sotShape);

    function scale() {                       // CSS px -> frame px
        const r = img.getBoundingClientRect();
        return {r, sx: img.naturalWidth ? img.naturalWidth / r.width : 1, sy: img.naturalHeight ? img.naturalHeight / r.height : 1};
    }
    function cssPoint(e) { const r = img.getBoundingClientRect(); return [Math.max(0, Math.min(r.width, e.clientX - r.left)), Math.max(0, Math.min(r.height, e.clientY - r.top))]; }
    function boxAt(p) {                      // box centred at p, in CSS px, kept inside the image (as the server does)
        const r = img.getBoundingClientRect(), s = (sotSize || 10) / 100;
        let w, h;
        if (sotShape === 'frame') { w = r.width * s; h = r.height * s; }
        else { h = r.height * s; w = h * ASPECT[sotShape]; }
        w = Math.min(w, r.width); h = Math.min(h, r.height);
        const x1 = Math.max(0, Math.min(p[0] - w / 2, r.width - w)), y1 = Math.max(0, Math.min(p[1] - h / 2, r.height - h));
        return [x1, y1, x1 + w, y1 + h];
    }
    function showBox(b, isDrag) {
        preview.style.display = 'block'; preview.classList.toggle('drag', isDrag);
        preview.style.left = b[0] + 'px'; preview.style.top = b[1] + 'px';
        preview.style.width = (b[2] - b[0]) + 'px'; preview.style.height = (b[3] - b[1]) + 'px';
    }
    function redrawPreview() { if (hover && !dragging) showBox(boxAt(hover), false); }

    img.addEventListener('mousemove', e => {
        hover = cssPoint(e);
        if (dragStart) {
            if (!dragging && Math.hypot(hover[0] - dragStart[0], hover[1] - dragStart[1]) > 6) dragging = true;
            if (dragging) { showBox([Math.min(dragStart[0], hover[0]), Math.min(dragStart[1], hover[1]), Math.max(dragStart[0], hover[0]), Math.max(dragStart[1], hover[1])], true); return; }
        }
        showBox(boxAt(hover), false);
    });
    img.addEventListener('mouseleave', () => { hover = null; if (!dragStart) preview.style.display = 'none'; });
    img.addEventListener('mousedown', e => {
        unfreeze();                                              // show the Pi's frame (it carries the SOT box)
        if (e.button !== 0) return;
        e.preventDefault();                                  // no image drag / text selection while drawing a box ...
        if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();   // ... but take the focus off sidebar buttons, so Esc / C reach the app
        dragStart = cssPoint(e); dragging = false;
    });
    document.addEventListener('mousemove', e => {          // keep drawing when the drag leaves the image
        if (!dragStart || !dragging || e.target === img) return;
        const p = cssPoint(e);
        showBox([Math.min(dragStart[0], p[0]), Math.min(dragStart[1], p[1]), Math.max(dragStart[0], p[0]), Math.max(dragStart[1], p[1])], true);
    });
    document.addEventListener('mouseup', e => {
        if (e.button !== 0 || !dragStart) return;
        const p = cssPoint(e);
        const b = dragging ? [Math.min(dragStart[0], p[0]), Math.min(dragStart[1], p[1]), Math.max(dragStart[0], p[0]), Math.max(dragStart[1], p[1])] : boxAt(dragStart);
        const c = dragging ? [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2] : dragStart;
        dragStart = null; dragging = false;
        if (b[2] - b[0] < 4 || b[3] - b[1] < 4) return;
        const {sx, sy} = scale();
        const f = v => Math.round(v);
        const body = `x=${f(c[0] * sx)}&y=${f(c[1] * sy)}&x1=${f(b[0] * sx)}&y1=${f(b[1] * sy)}&x2=${f(b[2] * sx)}&y2=${f(b[3] * sy)}`;
        fetch('/mouse_click', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body}).then(updateFromFlask);
        if (hover) showBox(boxAt(hover), false); else preview.style.display = 'none';
    });
    let wheelAcc = 0;                        // 1% per mouse-wheel notch; trackpads (many small deltas) accumulate
    img.addEventListener('wheel', e => {
        e.preventDefault();
        wheelAcc += e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
        const steps = Math.trunc(wheelAcc / 100);
        if (steps !== 0) { wheelAcc -= steps * 100; setSize((sotSize || 10) - steps); }
    }, {passive: false});
    const stopSOT = () => fetch('/cancel_sot', {method: 'POST'}).then(() => setTimeout(updateFromFlask, 150));
    img.addEventListener('contextmenu', e => { e.preventDefault(); stopSOT(); });
    $('sot_stop').onclick = stopSOT;
    $('modePill').onclick = () => { if ($('modePill').classList.contains('good')) stopSOT(); };

    //------------------------------------------------------------------------------------------------------------------
    function loadSotModels() {
        fetch('/sot_models').then(r => r.json()).then(data => {
            const sel = $('sot_model');
            sel.innerHTML = '';
            data.models.forEach(m => {
                const o = document.createElement('option');
                o.value = m.name; o.textContent = m.label + (m.ok ? '' : '  (no weights)'); o.disabled = !m.ok;
                o.selected = m.name === data.current;
                sel.appendChild(o);
            });
        });
    }
    $('sot_model').addEventListener('change', e => {
        $('sot_model_status').textContent = 'switching ...';
        post('/sot_model', {model: e.target.value}).then(r => r.json()).then(data => {
            $('sot_model_status').textContent = data.ok ? '' : 'Error: ' + data.error;
            setTimeout(() => { loadSotModels(); updateFromFlask(); }, 300);
        });
        e.target.blur();
    });
    loadSotModels();

    //------------------------------------------------------------------------------------------------------------------
    function loadSources(message) {
        fetch('/sources').then(r => r.json()).then(data => {
            const sel = $('source_select');
            sel.innerHTML = '';
            let found = false;
            data.sources.forEach(s => {
                const o = document.createElement('option');
                o.value = s.name; o.textContent = s.label;
                if (s.name === data.current) { o.selected = true; found = true; }
                sel.appendChild(o);
            });
            if (!found && data.current) {           // current source is a URL / custom path
                const o = document.createElement('option');
                o.value = data.current; o.textContent = data.current; o.selected = true;
                sel.appendChild(o);
            }
            $('source_status').textContent = message || ('Current: ' + data.current_path);
            $('topMeta').textContent = data.current + '  ·  ' + data.current_path;
        });
    }
    function switchSource(spec) {
        spec = (spec || '').trim();
        if (spec === '') return;
        const sel = $('source_select');
        sel.disabled = true;                          // one switch at a time
        $('source_status').textContent = 'Switching to ' + spec + ' ...';
        post('/switch_source', {source: spec}).then(r => r.json()).then(data => {
            if (data.ok) { $('source_custom').value = ''; setTimeout(() => { sel.disabled = false; loadSources(); }, 1500); }
            else { sel.disabled = false; loadSources('Error: ' + data.error); }     // dropdown back to the current source, error stays visible
        }).catch(() => { sel.disabled = false; loadSources(); });
    }
    // picking an entry switches right away; a typed URL / path switches on Enter
    $('source_select').addEventListener('change', e => switchSource(e.target.value));
    $('source_custom').addEventListener('keydown', e => { if (e.key === 'Enter') switchSource(e.target.value); });

    //------------------------------------------------------------------------------------------------------------------
    document.addEventListener('keydown', function (event) {
        // only typing must not reach the app (Escape closes it when no SOT is active, 'c' cancels SOT, Space toggles sidebar).
        // Buttons, checkboxes, sliders keep the focus after a click - keys pressed then are meant for the app.
        const t = event.target;
        const typing = t.tagName === 'TEXTAREA' || t.isContentEditable || (t.tagName === 'INPUT' && !['checkbox', 'radio', 'range', 'button', 'submit'].includes(t.type));
        if (typing) { if (event.key === 'Escape') t.blur(); return; }                      // Esc in a text field: leave the field
        if (t.tagName === 'SELECT' && event.key !== 'Escape') return;                       // arrows / letters pick an option
        if (t.tagName === 'BUTTON' && event.key === 'Enter') return;                          // press the focused button
        if (event.key === 'h' || event.key === 'H') {                                           // H: hide / show the side panel
            fetch('/toggle_sidebar', {method: 'POST'}).then(res => res.json()).then(data => {
                $('sidebar').classList.toggle('collapsed', !data.visible);
            });
            return;
        }
        let key = event.key;
        if (event.code === 'Space') { event.preventDefault(); key = 'Space'; }                 // Space: pause / resume a video file
        if (key === 'ArrowRight' || key === 'Home') event.preventDefault();                     // -> while paused: next frame; Home / R: from the start
        let extra = '';
        if (key === 'Space' && $('pausePill').hidden) { extra = '&thumb=' + seenThumb(); freezeScreen(); }   // pausing: freeze what is on screen now
        else if (key === 'Space') unfreeze();                                                           // resuming
        fetch('/key_press', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: `key=${encodeURIComponent(key)}` + extra})
            .then(() => { if (key === 'Space') setTimeout(updateFromFlask, 150); });
    });

    //------------------------------------------------------------------------------------------------------------------
    loadSources();
    updateFromFlask();
    setInterval(updateFromFlask, 1000);
</script>
</body>
</html>
